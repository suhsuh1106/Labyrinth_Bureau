<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<link rel="icon" href="data:,">
<title>미궁 용병단 행정실</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Gowun+Batang:wght@400;700&family=IBM+Plex+Sans+KR:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500&display=swap">
</head>
<body>
<div class="room">
<div class="wrap">
  <header class="plaque" aria-label="용병단 현황">
    <h1>회색늑대 용병단 행정실</h1>
    <div class="stats" id="stats"></div>
    <nav class="weeks" id="weeks" aria-label="이번 달 진행"></nav>
    <button class="sound newgame" id="newgame" type="button">새 게임</button>
  </header>
  <main class="co-desk" id="desk"></main>
</div>
</div>
<div class="arrival" id="arrival" hidden role="dialog" aria-modal="true" aria-label="미궁이 열린 변경">
  <div class="ar-scene" id="ar-scene">
    <div class="ar-land" aria-hidden="true"><span class="ar-ridge"></span><span class="ar-hill"></span><span class="ar-mouth"></span><span class="ar-tent t1"></span><span class="ar-tent t2"></span><span class="ar-tent t3"></span><span class="ar-lamp" id="ar-lamp"></span></div>
    <span class="ar-place">하르덴 백작령 서쪽 산허리 · 미궁 입구</span>
    <button class="ar-skip" id="ar-skip" type="button">건너뛰기</button>
    <div class="ar-box narr" id="ar-box" aria-live="polite">
      <span class="ar-seal" id="ar-seal" aria-hidden="true"></span>
      <span class="ar-who" id="ar-who"></span>
      <p class="ar-line" id="ar-line"></p>
      <span class="ar-foot"><span class="ar-dots" id="ar-dots"></span><button class="ar-next" id="ar-next" type="button">다음</button></span>
    </div>
  </div>
</div>
<div class="toast" id="toast" role="status" aria-live="polite"></div>
<div class="co-tip" id="tip" hidden></div>
<script type="module" src="/src/coMain.ts"></script>
</body>
</html>
