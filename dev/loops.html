<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>인과 루프 확인판</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Gowun+Batang:wght@700&family=IBM+Plex+Sans+KR:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500&display=swap">
<style>
/* 관리국 상황판: 위에 조작 띠, 왼쪽 큰 고리 그림, 오른쪽 고리 장부(켜진 날 띠), 아래 저량 곡선 · 보고 · 점검 */
:root {
  --bg: #f3f4f1; --panel: #fbfbf9; --ink: #1d2427; --mute: #67706f; --line: #d6dad4; --wash: #e7eae4;
  --r1: #c2410c; --r2: #9a3412; --r3: #b45309; --r4: #be123c; --r5: #a16207;
  --b1: #0f766e; --b3: #1d4ed8; --b4: #0e7490; --b5: #6d28d9;
  --hand: #1d2427; --good: #15803d; --bad: #b91c1c;
  --f-disp: 'Gowun Batang', 'Nanum Myeongjo', serif;
  --f-body: 'IBM Plex Sans KR', 'Apple SD Gothic Neo', 'Malgun Gothic', system-ui, sans-serif;
  --f-mono: 'IBM Plex Mono', ui-monospace, Menlo, monospace;
}
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) {
  --bg: #151a1c; --panel: #1b2224; --ink: #e4e8e3; --mute: #93a09d; --line: #2e3a3c; --wash: #243033;
  --r1: #fb923c; --r2: #fdba74; --r3: #fbbf24; --r4: #fb7185; --r5: #facc15;
  --b1: #2dd4bf; --b3: #60a5fa; --b4: #22d3ee; --b5: #a78bfa;
  --hand: #e4e8e3; --good: #4ade80; --bad: #f87171; color-scheme: dark;
} }
:root[data-theme="dark"] {
  --bg: #151a1c; --panel: #1b2224; --ink: #e4e8e3; --mute: #93a09d; --line: #2e3a3c; --wash: #243033;
  --r1: #fb923c; --r2: #fdba74; --r3: #fbbf24; --r4: #fb7185; --r5: #facc15;
  --b1: #2dd4bf; --b3: #60a5fa; --b4: #22d3ee; --b5: #a78bfa;
  --hand: #e4e8e3; --good: #4ade80; --bad: #f87171; color-scheme: dark;
}
* { box-sizing: border-box; }
body { margin: 0; background: var(--bg); color: var(--ink); font: 14px/1.5 var(--f-body); font-variant-numeric: tabular-nums; }
.wrap { max-width: 1320px; margin: 0 auto; padding-block: 16px 40px; padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); display: grid; gap: 14px; }
header { display: flex; flex-wrap: wrap; align-items: baseline; gap: 6px 16px; }
h1 { font: 700 22px/1.2 var(--f-disp); margin: 0; letter-spacing: -0.01em; }
.sub { color: var(--mute); font-size: 13px; }
h2 { font: 600 12px/1 var(--f-body); letter-spacing: 0.08em; color: var(--mute); margin: 0 0 8px; }
.bar { display: flex; flex-wrap: wrap; align-items: center; gap: 10px 18px; padding: 10px 12px; background: var(--panel); border: 1px solid var(--line); border-radius: 6px; }
.bar label { display: flex; align-items: center; gap: 6px; color: var(--mute); font-size: 13px; }
.bar select, .bar button { font: inherit; color: var(--ink); background: var(--bg); border: 1px solid var(--line); border-radius: 4px; padding: 3px 8px; cursor: pointer; }
.bar button:hover, .bar select:hover { border-color: var(--mute); }
.bar button:focus-visible, .bar select:focus-visible, .bar input:focus-visible { outline: 2px solid var(--b3); outline-offset: 1px; }
.seed { font-family: var(--f-mono); min-width: 3.5em; text-align: center; color: var(--ink); }
.day { flex: 1 1 280px; display: flex; align-items: center; gap: 8px; }
.day input { flex: 1; accent-color: var(--ink); min-width: 0; }
.day b { font-family: var(--f-mono); font-weight: 500; min-width: 4.5em; text-align: right; }
.main { display: grid; grid-template-columns: minmax(0, 1fr) 340px; gap: 14px; align-items: start; }
@media (max-width: 960px) { .main { grid-template-columns: minmax(0, 1fr); } }
.card { background: var(--panel); border: 1px solid var(--line); border-radius: 6px; padding: 12px; min-width: 0; }
.diagram { overflow-x: auto; }
.diagram svg { display: block; width: 100%; min-width: 640px; height: auto; }
svg text { fill: var(--ink); font-family: var(--f-body); }
.node rect { fill: var(--panel); stroke: var(--line); stroke-width: 1.2; }
.node.hand rect { fill: var(--wash); stroke: var(--hand); stroke-dasharray: 3 2; }
.node text { font-size: 14px; font-weight: 500; }
.edge path { fill: none; stroke-width: 1.6; opacity: 0.45; transition: opacity .2s, stroke-width .2s; }
.edge polygon { opacity: 0.45; transition: opacity .2s; }
.edge.link path { stroke: var(--mute); stroke-dasharray: 5 4; }
.edge.link polygon { fill: var(--mute); }
.edge .sg { font: 600 12px var(--f-mono); fill: var(--mute); }
.edge.on path { opacity: 1; stroke-width: 3.2; }
.edge.on polygon { opacity: 1; }
.edge.dim path, .edge.dim polygon { opacity: 0.12; }
.badge circle { stroke-width: 2; fill: var(--panel); transition: r .2s; }
.badge .id { font: 600 13px var(--f-mono); text-anchor: middle; }
.badge .nm { font-size: 11px; text-anchor: middle; fill: var(--mute); paint-order: stroke; stroke: var(--panel); stroke-width: 4px; stroke-linejoin: round; }
.badge.on circle { stroke-width: 0; }
.badge.on .id { fill: var(--panel); }
.legend { display: flex; flex-wrap: wrap; gap: 6px 16px; color: var(--mute); font-size: 12px; margin-top: 8px; }
.loops { display: grid; gap: 4px; }
.loop { display: grid; grid-template-columns: 34px minmax(0, 1fr) auto; gap: 2px 8px; align-items: center; padding: 6px 8px; border-radius: 4px; cursor: pointer; border: 1px solid transparent; }
.loop:hover { background: var(--wash); }
.loop.pin { border-color: var(--ink); }
.loop .tag { font: 600 12px var(--f-mono); text-align: center; border-radius: 3px; padding: 1px 0; border: 1.5px solid; }
.loop.on .tag { color: var(--panel) !important; }
.loop .n { font-weight: 500; }
.loop .cnt { font: 12px var(--f-mono); color: var(--mute); }
.loop .when { grid-column: 2 / 4; color: var(--mute); font-size: 12px; }
.loop svg { grid-column: 1 / 4; width: 100%; height: 12px; display: block; }
.lower { display: grid; grid-template-columns: minmax(0, 1.3fr) minmax(0, 1fr) minmax(0, 1fr); gap: 14px; align-items: start; }
@media (max-width: 1100px) { .lower { grid-template-columns: minmax(0, 1fr); } }
.spark { display: grid; grid-template-columns: 110px minmax(0, 1fr) 54px; gap: 8px; align-items: center; font-size: 13px; }
.spark + .spark { margin-top: 4px; }
.spark span:first-child { color: var(--mute); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.spark b { font: 500 13px var(--f-mono); text-align: right; }
.spark svg { width: 100%; height: 26px; display: block; }
.reps { list-style: none; margin: 0; padding: 0; display: grid; gap: 6px; max-height: 300px; overflow-y: auto; }
.reps li { padding: 6px 8px; border-left: 3px solid var(--line); background: var(--bg); border-radius: 0 4px 4px 0; }
.reps li.today { border-left-color: var(--ink); }
.reps .d { font: 12px var(--f-mono); color: var(--mute); }
.reps .t { font-weight: 500; }
.chip { display: inline-block; font-size: 11px; padding: 0 6px; margin: 2px 4px 0 0; border: 1px solid var(--line); border-radius: 10px; color: var(--mute); }
.empty { color: var(--mute); font-size: 13px; }
table { border-collapse: collapse; width: 100%; font-size: 12px; }
th, td { padding: 3px 4px; text-align: right; font-family: var(--f-mono); }
th { color: var(--mute); font-weight: 500; }
th:first-child, td:first-child { text-align: left; font-family: var(--f-body); }
tbody tr + tr td { border-top: 1px solid var(--line); }
td.zero { color: var(--bad); }
.ok { color: var(--good); } .no { color: var(--bad); }
.checks { display: grid; gap: 2px; font-size: 13px; margin-bottom: 10px; }
.tblwrap { overflow-x: auto; }
.note { color: var(--mute); font-size: 12px; margin: 8px 0 0; }
@media (prefers-reduced-motion: reduce) { * { transition: none !important; } }
</style>
</head>
<body>
<div class="wrap">
  <header>
    <h1>인과 루프 확인판</h1>
    <span class="sub">미궁관리국 배경 엔진 · 봇 한 판을 돌려 날마다 켜진 고리에 불을 켠다</span>
  </header>
  <div class="bar">
    <label for="bot">국장 봇 <select id="bot"><option value="idle">idle · 손 놓음</option><option value="normal">normal · 보고대로</option><option value="smart" selected>smart · 추세로</option></select></label>
    <label>시드 <button id="sd-" type="button" aria-label="시드 내리기">−</button><span class="seed" id="seed">1000</span><button id="sd+" type="button" aria-label="시드 올리기">+</button></label>
    <label for="nocheck"><input type="checkbox" id="nocheck"> B3 견제 끔</label>
    <div class="day"><button id="play" type="button">재생</button><input type="range" id="day" min="1" max="360" value="120" aria-label="날"><b id="dayv">120일</b></div>
  </div>
  <div class="main">
    <section class="card diagram" aria-label="인과 루프 그림"><svg id="dia" viewBox="0 0 1000 560" role="img" aria-label="인과 루프 그림"></svg>
      <div class="legend"><span>굵은 화살표 · 채운 원: 그날 켜진 고리</span><span>점선 상자: 국장의 손</span><span>회색 점선: 고리 사이 엮임</span><span>+ 같은 쪽 · − 반대쪽</span></div>
    </section>
    <section class="card"><h2>고리 · 켜진 날</h2><div class="loops" id="loops"></div><p class="note">줄을 누르면 그림에서 그 고리만 보이고, 띠를 누르면 그날로 간다.</p></section>
  </div>
  <div class="lower">
    <section class="card"><h2>저량</h2><div id="sparks"></div></section>
    <section class="card"><h2>그날까지의 보고</h2><ul class="reps" id="reps"></ul></section>
    <section class="card"><h2>점검</h2><div class="checks" id="checks"></div><div class="tblwrap" id="sweep"><p class="empty">봇마다 20판을 돌리는 중…</p></div></section>
  </div>
</div>
<script type="module" src="./loops.ts"></script>
</body>
</html>
