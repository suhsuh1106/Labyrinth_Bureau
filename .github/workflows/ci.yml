name: CI

on:
  pull_request:
  push:
    branches: [main]

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: 타입 검사
        run: npm run typecheck
      - name: 테스트 (장부, 시장, 경쟁자, 담합, 근원, 화면)
        run: npm test
      - name: 빌드
        run: npx vite build
      - name: 봇 시뮬레이션 요약
        run: npm run sim -- --games 200 --style smart
